name: Carry paper simulation (ADR-0067; read-only, unlocked windows only)

on:
  push:
    branches: [claude/project-thread-aguoxx]
    paths: [".github/workflows/carry_paper_sim.yml", "scripts/run_carry_paper_sim.py", "src/cointrader/carry/**"]
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {symbol: BTCUSDT, start: "2021-01-01", end: "2022-08-17"}
          - {symbol: ETHUSDT, start: "2021-01-01", end: "2022-08-17"}
          - {symbol: BTCUSDT, start: "2023-04-20", end: "2024-03-25"}
          - {symbol: ETHUSDT, start: "2023-04-20", end: "2024-03-25"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python3 scripts/run_carry_paper_sim.py --symbol ${{ matrix.symbol }} --start ${{ matrix.start }} --end ${{ matrix.end }}
