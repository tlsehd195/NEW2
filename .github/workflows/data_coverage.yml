name: Data coverage preflight (reports only; registers and locks nothing)

on:
  workflow_dispatch:
    inputs:
      symbol:
        required: true
        default: "BTCUSDT"
      timeframe:
        required: true
        default: "1d"
      start:
        required: true
      end:
        required: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Check coverage
        env:
          SYMBOL: ${{ inputs.symbol }}
          TIMEFRAME: ${{ inputs.timeframe }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python3 scripts/check_data_coverage.py --symbol "$SYMBOL" --timeframe "$TIMEFRAME" --start "$START" --end "$END" --out reports/coverage.json
