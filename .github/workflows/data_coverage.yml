name: Data coverage preflight (reports only; registers and locks nothing)

on:
  # A workflow must already be on the default branch to be dispatched; the push trigger lets a branch run its own
  # preflight with the defaults below before it is merged.
  push:
    branches: ["claude/indicator-gate-validation"]
    paths: [".github/workflows/data_coverage.yml", "scripts/check_data_coverage.py"]
  workflow_dispatch:
    inputs:
      symbol:
        required: false
        default: "BTCUSDT"
      timeframe:
        required: false
        default: "1d"
      start:
        required: false
        default: "2019-09-08"
      end:
        required: false
        default: "2022-08-17"

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Check coverage
        env:
          SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
          TIMEFRAME: ${{ inputs.timeframe || '1d' }}
          START: ${{ inputs.start || '2019-09-08' }}
          END: ${{ inputs.end || '2022-08-17' }}
        run: python3 scripts/check_data_coverage.py --symbol "$SYMBOL" --timeframe "$TIMEFRAME" --start "$START" --end "$END" --out reports/coverage.json
      - name: Print report
        if: always()
        run: cat reports/coverage.json || echo "no report written"
