name: 5m diagnosis (ADR-0066; reads TRAIN+VALIDATION only)

on:
  push:
    branches: [claude/project-thread-rahxii]
    paths: [".github/workflows/five_min_diagnosis.yml", "scripts/diagnose_5m.py"]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python3 scripts/diagnose_5m.py --symbol ${{ matrix.symbol }} --start 2023-04-20 --end 2024-03-25
