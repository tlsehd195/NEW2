name: Taker-flow diagnosis (ADR-0064; reads TRAIN+VALIDATION only)

on:
  push:
    branches: [claude/project-thread-pt5ty1]
    paths: [".github/workflows/flow_diagnosis.yml", "scripts/diagnose_flow_signal.py"]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: BTCUSDT
        run: python3 scripts/diagnose_flow_signal.py --symbol BTCUSDT --start 2023-04-20 --end 2024-03-25
      - name: ETHUSDT
        run: python3 scripts/diagnose_flow_signal.py --symbol ETHUSDT --start 2023-04-20 --end 2024-03-25
