name: Indicator candidates diagnosis (ADR-0070; reads TRAIN+VALIDATION only)

on:
  push:
    branches: [claude/project-thread-hcnkt7]
    paths: [".github/workflows/indicator_candidates.yml", "scripts/diagnose_indicator_candidates.py", "src/cointrader/features/candidate_indicators.py"]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: BTCUSDT
        run: python3 scripts/diagnose_indicator_candidates.py --symbol BTCUSDT --other ETHUSDT --start 2023-04-20 --end 2024-03-25 --out reports/btc.json > /dev/null
      - name: ETHUSDT
        run: python3 scripts/diagnose_indicator_candidates.py --symbol ETHUSDT --other BTCUSDT --start 2023-04-20 --end 2024-03-25 --out reports/eth.json > /dev/null
      - name: Print BTC
        run: cat reports/btc.json
      - name: Print ETH
        run: cat reports/eth.json
      - name: Pooled multiple-testing family
        run: python3 scripts/diagnose_indicator_candidates.py --combine reports/btc.json reports/eth.json
