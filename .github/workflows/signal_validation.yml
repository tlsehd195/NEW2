name: Run signal validation (pre-registered; TEST used once, then locked)

on:
  # push is only here so GitHub indexes the workflow for dispatch; the job is skipped on push.
  push:
    branches: [main]
    paths: [".github/workflows/signal_validation.yml"]
  workflow_dispatch:
    inputs:
      hypothesis_id:
        description: "New pre-registration id, e.g. H-0013"
        required: true
      family:
        description: "swing | scalp"
        required: true
        default: "swing"
      strategies:
        description: "Space-separated registered strategy ids (one timeframe)"
        required: true
      symbol:
        required: true
        default: "ETHUSDT"
      timeframe:
        required: true
        default: "1h"
      start:
        required: true
      end:
        required: true
      statement:
        required: true
      rationale:
        description: ">= 40 chars: what is new versus earlier hypotheses"
        required: true
      registered_by:
        required: true
        default: "동동"
      replication:
        description: "Human-declared replication of an already registered candidate set (true/false)"
        required: false
        default: "false"

      max_per_window:
        description: "Registration budget per 30 days (default 3). Above 3 only with a human decision recorded in budget_adr"
        required: false
        default: "3"
      budget_adr:
        description: "ADR id recording the human-approved budget raise (required when max_per_window > 3)"
        required: false
        default: ""

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run validation
        # Inputs go through env vars, never interpolated into the shell script.
        env:
          HID: ${{ inputs.hypothesis_id }}
          FAMILY: ${{ inputs.family }}
          STRATEGIES: ${{ inputs.strategies }}
          SYMBOL: ${{ inputs.symbol }}
          TIMEFRAME: ${{ inputs.timeframe }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          STATEMENT: ${{ inputs.statement }}
          RATIONALE: ${{ inputs.rationale }}
          REGISTERED_BY: ${{ inputs.registered_by }}
          REPLICATION: ${{ inputs.replication }}
          MAX_PER_WINDOW: ${{ inputs.max_per_window }}
          BUDGET_ADR: ${{ inputs.budget_adr }}
        run: |
          # shellcheck disable=SC2086
          REPLICATION_FLAG=""
          if [ "$REPLICATION" = "true" ]; then REPLICATION_FLAG="--replication"; fi
          python3 scripts/run_validation.py --hypothesis-id "$HID" --family "$FAMILY" \
            --strategies $STRATEGIES --symbol "$SYMBOL" --timeframe "$TIMEFRAME" \
            --start "$START" --end "$END" --statement "$STATEMENT" --rationale "$RATIONALE" \
            --registered-by "$REGISTERED_BY" ${REPLICATION_FLAG} \
            --max-per-window "$MAX_PER_WINDOW" ${BUDGET_ADR:+--budget-adr "$BUDGET_ADR"} --out reports/validation.json > /dev/null
      - name: Print report
        if: always()
        run: cat reports/validation.json || echo "no report written"
      - name: Print files that must be committed back (lock, pre-registration, ledger)
        # The runner's checkout is thrown away; these exact lines are copied into the repo afterwards.
        if: always()
        run: |
          git status --short
          # Every added line, however many candidates wrote ledger rows.
          git add --intent-to-add research configs/locked_windows.json
          echo "=== added lines ==="
          git diff --no-color --unified=0 -- configs/locked_windows.json research | grep '^+' | grep -v '^+++' || echo "(none)"
