name: Volume-profile signal diagnosis (ADR-0077; unlocked ranges only)

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-cznzyu]
    paths: [".github/workflows/volume_profile_diag.yml", "scripts/diagnose_volume_profile.py"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: BTCUSDT
        run: python3 scripts/diagnose_volume_profile.py --symbol BTCUSDT --start 2023-04-20 --end 2024-03-25
      - name: ETHUSDT
        run: python3 scripts/diagnose_volume_profile.py --symbol ETHUSDT --start 2024-12-14 --end 2026-09-01
