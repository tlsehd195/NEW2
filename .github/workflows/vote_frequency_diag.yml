name: Indicator-vote trade-frequency diagnostic (signal counts only; registers and locks nothing)

on:
  # push is only here so GitHub indexes the workflow for dispatch; the job is skipped on push.
  push:
    branches: [main]
    paths: [".github/workflows/vote_frequency_diag.yml"]
  workflow_dispatch:
    inputs:
      symbol:
        required: true
        default: "SOLUSDT"
      start:
        required: true
        default: "2022-01-15"
      end:
        description: "Exclusive; the script refuses any range that overlaps a locked window"
        required: true
        default: "2024-06-21"

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Diagnose
        env:
          SYMBOL: ${{ inputs.symbol }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python3 scripts/diagnose_vote_frequency.py --symbol "$SYMBOL" --start "$START" --end "$END" --out reports/vote_frequency.json > /dev/null
      - name: Print report
        if: always()
        run: cat reports/vote_frequency.json || echo "no report written"
